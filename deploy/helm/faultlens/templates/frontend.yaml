apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "faultlens.labels" . | nindent 4 }}
    app.kubernetes.io/name: faultlens-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: faultlens-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faultlens-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "faultlens.podSecurity" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/{{ .Values.image.frontend }}:{{ include "faultlens.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "faultlens.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "faultlens.labels" . | nindent 4 }}
    app.kubernetes.io/name: faultlens-frontend
spec:
  selector:
    app.kubernetes.io/name: faultlens-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
