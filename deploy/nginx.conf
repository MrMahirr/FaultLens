# Example Nginx configuration for FaultLens (Debian/Ubuntu), TLS terminated here.
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/faultlens
#   2. replace app.faultlens.com with your domain (server_name, certificate paths)
#   3. sudo ln -s /etc/nginx/sites-available/faultlens /etc/nginx/sites-enabled/
#   4. sudo certbot certonly --nginx -d app.faultlens.com
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# The UI, API and WebSocket share one origin, so build the frontend with
#   NEXT_PUBLIC_API_URL=https://app.faultlens.com/api/v1  NEXT_PUBLIC_WS_URL=wss://app.faultlens.com/ws
# and set CORS_ORIGINS=https://app.faultlens.com, APP_URL=https://app.faultlens.com.

server {
    listen 80;
    listen [::]:80;
    server_name app.faultlens.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.faultlens.com;

    ssl_certificate     /etc/letsencrypt/live/app.faultlens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.faultlens.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 2m;

    # Security headers ("always": also on error responses). Repeated in every location that
    # sets its own add_header, because nginx does not inherit them then.
    #  - HSTS: browsers use HTTPS only for a year (add "preload" only once you are sure).
    #  - CSP: Next.js inlines bootstrap scripts and styles, hence 'unsafe-inline' for those;
    #    everything else only from this origin; no framing, plugins or foreign form targets.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Backend API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3500/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3500/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Actuator is never served publicly (metrics are scraped on MANAGEMENT_PORT internally).
    location /actuator { return 404; }

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
