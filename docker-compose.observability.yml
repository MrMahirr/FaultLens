# Metrics and traces (P08). Add to the normal stack:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Grafana http://localhost:3001 (dashboard "FaultLens"), Prometheus http://localhost:9090,
# Jaeger (traces) http://localhost:16686.
services:
  backend:
    environment:
      # Actuator on its own port: Prometheus scrapes it inside the compose network. Not published.
      - MANAGEMENT_PORT=9464
      - TRACING_EXPORT_ENABLED=true
      - TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in .env; Grafana asks to change the default at first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686" # UI; OTLP (4317/4318) stays inside the network

volumes:
  prometheus_data:
  grafana_data:
