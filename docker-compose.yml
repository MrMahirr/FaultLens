services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: faultlens
      POSTGRES_USER: faultlens
      POSTGRES_PASSWORD: faultlens
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 keeps data under /var/lib/postgresql/<major>/docker; mount the parent.
      # New volume name: a Postgres 16 data directory cannot be opened by 18 (see deploy/POSTGRES_UPGRADE.md).
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (Kafka 4 has no ZooKeeper support).
  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092); EXTERNAL: the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Fixed so the storage formatted on first start matches on restarts.
      CLUSTER_ID: cR1Ca4T5QnSL915zEnOhQA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  backend:
    build:
      context: ./faultlens-backend
      dockerfile: Dockerfile
    ports:
      - "3500:3500"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=faultlens
      - DB_USER=faultlens
      - DB_PASS=faultlens
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_SERVERS=kafka:29092
      - PORT=3500
      # Values below come from the root .env (see .env.example).
      # Empty JWT_SECRET -> random key per start (you are logged out on every backend restart).
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - AI_ENABLED=${AI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Empty -> generated and printed once in the backend log; must be changed at first login
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - COLLECTOR_FILE_ALLOWED_DIRS=${COLLECTOR_FILE_ALLOWED_DIRS:-/var/log}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./faultlens-frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the bundle at build time (runtime env has no effect).
      # They are the URLs the *browser* uses, so localhost is correct for local use.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3500/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3500/ws}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  postgres18_data:
