name: FaultLens CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot) — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faultlens-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Uses the Maven Wrapper so CI builds with the same Maven version as developers.
      - name: Build and unit tests
        run: ./mvnw -B -ntp verify -DskipITs

  backend-it:
    name: Backend — integration tests (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faultlens-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # *IT classes (failsafe) against real Postgres, Kafka and Redis; the runner provides Docker.
      - name: Integration tests
        run: ./mvnw -B -ntp verify -DskipUTs -pl api -am

      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: faultlens-backend/api/target/failsafe-reports

  frontend:
    name: Frontend (Next.js) — lint, typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faultlens-frontend
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in faultlens-frontend/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: faultlens-frontend/package.json

      # Kept in line with faultlens-frontend/Dockerfile (node:20); both move together in the upgrade phase.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: faultlens-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Placeholder values; NEXT_PUBLIC_* are inlined at build time.
          NEXT_PUBLIC_API_URL: http://localhost:3500/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:3500/ws
