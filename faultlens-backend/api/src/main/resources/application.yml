spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: faultlens-api9
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:faultlens}
    username: ${DB_USER:faultlens}
    password: ${DB_PASS:faultlens}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: faultlens-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.faultlens.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:3500}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

faultlens:
  jwt:
    # >= 32 bytes. Unset -> random per-process key (sessions end on restart). Generate: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    # Access tokens are short-lived (15 min); the SPA renews them with the refresh cookie.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  auth:
    # Single-use refresh token (HttpOnly cookie, rotated in Redis on every refresh).
    refresh-ttl: ${REFRESH_TOKEN_TTL:P7D}
    # Keep true in production (HTTPS). Browsers accept Secure cookies on http://localhost.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    login-max-failures: 5
    login-lock-duration: PT15M
  collector:
    file:
      # Comma-separated directories LOCAL_FILE sources may read; anything else is rejected.
      allowed-dirs: ${COLLECTOR_FILE_ALLOWED_DIRS:/var/log}
    k8s:
      reconnect-interval-seconds: 30
    ssh:
      connect-timeout-ms: 5000
      retry-interval-seconds: 10
  analyzer:
    ai:
      enabled: ${AI_ENABLED:false}
      openai-api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  security:
    # Initial password for the 'admin' account (min 8 chars). Empty -> a random one is generated
    # and logged once at startup. Either way it must be changed at first login.
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}

logging:
  level:
    org.apache.tomcat.util.http.parser.Cookie: WARN
