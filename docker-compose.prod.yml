services:
  backend:
    build:
      context: ./faultlens-backend
      dockerfile: Dockerfile
    image: faultlens-backend:latest
    container_name: faultlens-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-3500}:3500"
    environment:
      # Database connection should point to managed DB
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-faultlens}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      # Redis connection should point to managed Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Kafka connection should point to managed Kafka
      - KAFKA_SERVERS=${KAFKA_SERVERS}
      # Security & CORS
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Refresh cookie is Secure (HTTPS; browsers also accept it on http://localhost).
      # Set false only for plain-HTTP access through another host name or IP.
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-true}
      # Alarm e-mails over SMTP; SMTP_HOST empty -> the e-mail channel is off.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_FROM=${SMTP_FROM:-FaultLens <faultlens@localhost>}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - WEBHOOK_ALLOW_PRIVATE_HOSTS=${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - COLLECTOR_FILE_ALLOWED_DIRS=${COLLECTOR_FILE_ALLOWED_DIRS:-/var/log}
      - AI_ENABLED=${AI_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DOCKER_HOST=tcp://docker-proxy:2375
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # /readyz stays on the main port even when actuator runs on MANAGEMENT_PORT
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3500/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Read-only Docker API for the collector (P08): only container listing, inspect and logs;
  # no POST/DELETE, so a compromised backend cannot start containers or reach the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Daily pg_dump of the database (P08); dumps in the faultlens_backups volume, 14 days kept.
  # Back up that volume (or BACKUP_DIR) off the host as well. One-off run:
  #   docker compose -f docker-compose.prod.yml run --rm db-backup /pg-backup.sh --now
  db-backup:
    image: postgres:18-alpine
    restart: always
    entrypoint: ["/bin/sh", "/pg-backup.sh"]
    environment:
      - PGHOST=${DB_HOST}
      - PGPORT=${DB_PORT:-5432}
      - PGDATABASE=${DB_NAME:-faultlens}
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASS}
      - BACKUP_HOUR=${BACKUP_HOUR:-02}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/pg-backup.sh:/pg-backup.sh:ro
      - ${BACKUP_DIR:-faultlens_backups}:/backups

  frontend:
    build:
      context: ./faultlens-frontend
      dockerfile: Dockerfile
      # Baked into the client bundle at build time; rebuild the image when they change.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.faultlens.com/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.faultlens.com/ws}
    image: faultlens-frontend:latest
    container_name: faultlens-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  faultlens_backups:
